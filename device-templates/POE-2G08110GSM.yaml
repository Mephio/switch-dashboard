model: "POE-2G08110GSM"
manufacturer: "Mokerlink"

# Login from login.html: the browser computes MD5(username + password) and
# sends it as the hidden "Response" field, and also sets cookie admin=<md5>.
# The scraper fills {{md5hash}} with the same value. The cookie is not set by
# the template, so if the switch requires it, the login will fail; verify.
login:
  required: true
  url: "/login.cgi"
  method: "POST"
  referer_path: "/login.html"
  post_data:
    username: "{{username}}"
    password: "{{password}}"
    Response: "{{md5hash}}"
    language: "EN"
  # login.html sets this cookie with JS; the switch needs it on later requests.
  cookies:
    admin: "{{md5hash}}"

# Source pages used to build this template:
#   /info.cgi, /port.cgi, /port.cgi?page=stats
# DHCP snooping: not present on this firmware (not in the menu), so no section.

# Global device information from /info.cgi (single key/value table)
device_info:
  url: "/info.cgi"
  method: "key_value_grid"
  mappings:
    mac: "MAC Address"
    ip: "IP Address"
    firmware: "Firmware Version"
    model: "Device Model"
  # No uptime row on this firmware; uptime will be empty.

# Port state from /port.cgi.
# The page has two forms (config) and a status table. The status table is the
# one containing "Actual", so it is selected via port_table_match.
# Column indexes in the status table:
#   0 Port | 1 State | 2 Speed Config | 3 Speed Actual | 4 Flow Config | 5 Flow Actual
ports:
  url: "/port.cgi"
  source: "port_table"
  port_table_match: "Actual"
  columns:
    port: 0
    admin_state: 1
    actual_link: 3
    flow_control: 5

# MAC forwarding table from /mac.cgi?page=fwd_tbl (single HTML page; the
# "Next Page" button is disabled in the sample, so no pagination is configured).
# TODO: if "Next Page" is enabled on a switch with many MAC entries, pagination
# must be added here (page_parameter / perpage_parameter / cmd_parameter).
# Columns are resolved by header name (No., MAC Address, VLAN ID, Type, Port).
mac_table:
  url: "/mac.cgi?page=fwd_tbl"
  format: "html"

# Packet counters from /port.cgi?page=stats.
# Terms are deliberately specific: a bare "tx"/"rx" term would also match
# TxBadPkt/RxBadPkt and overwrite the good-packet column index.
# This page has no byte counters; the scraper estimates bytes as packets * 800.
statistics:
  url: "/port.cgi?page=stats"
  method: "header_aware"
  terms:
    tx_packets: ["txgoodpkt"]
    rx_packets: ["rxgoodpkt"]
    tx_bytes: []
    rx_bytes: []

# IGMP snooping: enable checkbox "enable_igmp" on /igmp.cgi?page=enable_igmp
# and the multicast group dump on /igmp.cgi?page=dump (headers IP Address,
# Port, VLAN ID).
igmp:
  url: "/igmp.cgi?page=dump"
  enable_input_name: "enable_igmp"
  table_header_keywords: ["IP Address", "Port", "VLAN ID"]

# Jumbo frame: size select "jumboframe" on /fwd.cgi?page=jumboframe.
# No enable checkbox on this firmware (the scraper treats it as always enabled).
jumbo_frame:
  url: "/fwd.cgi?page=jumboframe"
  select_name: "jumboframe"

# Configuration backup: /config_back.cgi?cmd=conf_backup (same as the
# "Backup" button in the switch's Backup page).
backup:
  url: "/config_back.cgi?cmd=conf_backup"
  referer_path: "/config_back.cgi"
  method: "GET"

# Reboot: POST cmd=reboot to /reboot.cgi (form on the switch's Reboot page).
reboot:
  url: "/reboot.cgi"
  referer_path: "/reboot.cgi"
  method: "POST"
  post_data:
    cmd: "reboot"
