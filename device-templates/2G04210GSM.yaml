model: "2G04210GSM"
manufacturer: "Mokerlink"   # assumed same brand as POE-2G08110GSM; confirm from the label

# Login from login.html: the browser computes MD5(username + password) and
# sends it as the hidden "Response" field, and also sets cookie admin=<md5>.
# The scraper fills {{md5hash}} with the same value; cookies are set below.
login:
  required: true
  url: "/login.cgi"
  method: "POST"
  referer_path: "/login.html"
  post_data:
    username: "{{username}}"
    password: "{{password}}"
    Response: "{{md5hash}}"
    language: "EN"
  cookies:
    admin: "{{md5hash}}"

# Source pages used to build this template:
#   /info.cgi, /port.cgi, /port.cgi?page=stats, /mac.cgi?page=fwd_tbl,
#   /igmp.cgi?page=dump, /fwd.cgi?page=jumboframe, /config_back.cgi, /reboot.cgi

# Global device information from /info.cgi (single key/value table)
device_info:
  url: "/info.cgi"
  method: "key_value_grid"
  mappings:
    mac: "MAC Address"
    ip: "IP Address"
    firmware: "Firmware Version"
    model: "Device Model"

# Port state from /port.cgi (status table is the one containing "Actual").
# Column indexes: 0 Port | 1 State | 2 Speed Config | 3 Speed Actual | 4 Flow Config | 5 Flow Actual
ports:
  url: "/port.cgi"
  source: "port_table"
  port_table_match: "Actual"
  columns:
    port: 0
    admin_state: 1
    actual_link: 3
    flow_control: 5

# MAC forwarding table from /mac.cgi?page=fwd_tbl (single HTML page)
mac_table:
  url: "/mac.cgi?page=fwd_tbl"
  format: "html"

# Packet counters from /port.cgi?page=stats.
# Specific terms only: bare "tx"/"rx" would also match TxBadPkt/RxBadPkt.
# No byte counters on this firmware; bytes are estimated as packets * 800.
statistics:
  url: "/port.cgi?page=stats"
  method: "header_aware"
  terms:
    tx_packets: ["txgoodpkt"]
    rx_packets: ["rxgoodpkt"]
    tx_bytes: []
    rx_bytes: []

# IGMP snooping: enable checkbox "enable_igmp" and the group dump on /igmp.cgi?page=dump
igmp:
  url: "/igmp.cgi?page=dump"
  enable_input_name: "enable_igmp"
  table_header_keywords: ["IP Address", "Port", "VLAN ID"]

# Jumbo frame: size select "jumboframe" on /fwd.cgi?page=jumboframe (no enable checkbox)
jumbo_frame:
  url: "/fwd.cgi?page=jumboframe"
  select_name: "jumboframe"

# Configuration backup: /config_back.cgi?cmd=conf_backup
backup:
  url: "/config_back.cgi?cmd=conf_backup"
  referer_path: "/config_back.cgi"
  method: "GET"

# Reboot: POST cmd=reboot to /reboot.cgi
reboot:
  url: "/reboot.cgi"
  referer_path: "/reboot.cgi"
  method: "POST"
  post_data:
    cmd: "reboot"
